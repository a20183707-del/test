[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsg-extractor-documental"
version = "1.1.0"
description = "Extracción documental local con Gemini, validación y revisor independiente"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
bsg-extractor = "bsg_extractor.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

